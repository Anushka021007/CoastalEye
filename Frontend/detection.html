<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoastalEye - Detection Detail</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="css/style.css" rel="stylesheet">
</head>
<body>
    <!-- Top Bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-arrow-left"></i> Back to Detections
            </a>
            <span class="text-white-50">CoastalEye</span>
        </div>
    </nav>

    <div class="container-fluid py-4">
        <div class="container">
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-start mb-4">
                <div>
                    <h1 id="detection-title">Detection Detail</h1>
                    <p class="text-muted mb-0" id="detection-time"></p>
                </div>
                <button id="download-report-btn" class="btn btn-primary">
                    <i class="bi bi-file-earmark-pdf"></i> Download PDF Report
                </button>
            </div>

            <!-- Loading -->
            <div id="loading" class="text-center py-5">
                <div class="spinner-border text-info"></div>
            </div>

            <!-- Main content -->
            <div id="content" class="d-none">
                <div class="row g-4">
                    <!-- Left: Map + Time Slider -->
                    <div class="col-lg-8">
                        <div class="card">
                            <div class="card-body">
                                <div id="map"></div>
                                
                                <!-- Time slider -->
                                <div class="mt-3">
                                    <div class="d-flex justify-content-between mb-2 small text-muted">
                                        <span>6 hours before</span>
                                        <span id="time-label">Detection time</span>
                                        <span>Detection time</span>
                                    </div>
                                    <input type="range" class="form-range" id="time-slider" 
                                           min="0" max="100" value="100">
                                </div>
                            </div>
                        </div>

                        <!-- Stats -->
                        <div class="row g-2 mt-2">
                            <div class="col-3">
                                <div class="card text-center">
                                    <div class="card-body py-2">
                                        <small class="text-muted">Area</small>
                                        <div class="fw-bold" id="stat-area">?</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="card text-center">
                                    <div class="card-body py-2">
                                        <small class="text-muted">Confidence</small>
                                        <div class="fw-bold" id="stat-confidence">?</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="card text-center">
                                    <div class="card-body py-2">
                                        <small class="text-muted">Wind</small>
                                        <div class="fw-bold" id="stat-wind">?</div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-3">
                                <div class="card text-center">
                                    <div class="card-body py-2">
                                        <small class="text-muted">Suspects</small>
                                        <div class="fw-bold" id="stat-suspects">?</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Right: Suspect Panel -->
                    <div class="col-lg-4">
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">Suspect Vessels</h5>
                                <div class="text-muted small mb-3">Ranked by evidence score</div>
                                <div id="suspects-list"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for evidence details -->
    <div class="modal fade" id="evidenceModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Evidence Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="evidence-body"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/api.js"></script>
    <script src="js/detection.js"></script>
</body>
</html>
